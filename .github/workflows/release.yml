name: Build and publish DIAL for Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test DIAL
        run: npm test
      - name: Build the Windows installer
        run: npm run dist:win
      - name: Publish the release and update feed
        shell: pwsh
        run: |
          $assets = @(
            (Get-ChildItem release -File -Filter 'DIAL-Setup-*.exe').FullName
            (Get-ChildItem release -File -Filter 'DIAL-Setup-*.exe.blockmap').FullName
            (Join-Path $PWD 'release/latest.yml')
          ) | Where-Object { $_ -and (Test-Path $_) }
          if ($assets.Count -ne 3) { throw "Expected installer, blockmap, and latest.yml; found $($assets.Count) assets." }
          gh release create $env:GITHUB_REF_NAME @assets --title "DIAL $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes "Instalador de DIAL para Windows y manifiesto de actualizaciones. Consulta el README para las funciones y límites actuales." --verify-tag --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
